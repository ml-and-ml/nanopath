# Four connected source tiles share spatial context in the JEPA predictor.
# Starts from spatial-rel-jepa; every tile occurrence still counts toward the cap.
# Keep the fixed v2 probe suite identical across all arms.
project:
  name: connected-jepa4
  family: nanopath
  recipe_id: dinov2-vits14-reg-robust-norm-connected-jepa4
  output_dir: /data/$USER/nanopath/connected-context-20260910/connected-jepa4
  wandb_dir: /data/$USER/nanopath/wandb

data:
  # Original reference pool supplies FINO metadata and calibration images.
  # spatial_dir supplies the connected training/validation tiles.
  dataset_dir: /data/nanopath_parquet
  spatial_dir: /data/$USER/nanopath/connected-context-20260910/spatial-parquet
  connected_source_dir: /data/hassan/embeddings/OM-temp # reads only coords/geometry, never features
  connected_tiles: 4 # distinct eight-connected tiles from one slide per group
  input_mode: parquet # wsi reads the preserved live-slide path instead
  wsi_dir: /block/TCGA
  target_mpp_range: [0.25, 2.0]
  case_bag_size: 1
  case_map: /data/hassan/tcga-rnaseq/tpm/dx_slide_to_patient_target.csv
  split_seed: 7777
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.4, 1.0]
  local_crop_scale: [0.08, 0.35]
  color_jitter: 0.3
  color_jitter_saturation: 0.3
  hed_jitter: 0.07
  aug_hue_local: 0.2
  tissue_thresh: 0.0

model:
  type: robust_norm_dinov2_vits14_reg

train:
  calibrate: true
  fino_bag_loss: false
  contract_lo: 0.0
  seed: 7777
  bf16: true
  activation_checkpointing: false
  batch_size: 128
  num_workers: 16
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000 # tile presentations; global/local crops still count as one sample
  max_train_flops: 1000000000000000000 # 1.0e18, the leaderboard FLOP budget
  log_every: 20
  save_every: 1000
  # Validation pass every `eval_every` steps over `val_batches` held-out batches
  eval_every: 200
  val_batches: 16
  global_views: 2
  local_views: 14
  global_size: 224
  local_size: 128
  resume: null # optional explicit checkpoint path; null means always start fresh and wipe output_dir

dino:
  lr: 0.000125
  lr_min: 1.0e-6
  adam_beta2: 0.999
  warmup_fraction: 0.0909
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384
  clip_grad: 3.0
  kde_loss_weight: 0.1
  kde_concentration: 10.0
  # Contiguous block masking and the predictor for I-JEPA patch regression.
  jepa_relation_weight: 0.1 # auxiliary cosine-relation MSE; zero preserves ordinary JEPA
  jepa_relation_pairs: spatial # spatial or random masked-patch pairs
  jepa_neighbor_context: true
  jepa_cls_context: false
  jepa_pred_depth: 4
  jepa_pred_width: 0
  jepa_blocks: 4
  jepa_block_scale: 0.1

# FINO encourages subtype, gene-expression, and fraction-genome-altered signals.
fino:
  enabled: true
  gamma_max: 0.7
  expression_variance: fixed # fixed, global, or tile; expression-only uncertainty
  continuous_registers: false
  discrete: [[subtype, 1]]
  continuous: [[expr512, 3], [fga, 3]]

probe:
  enabled: true
  model_weights: ema
  count: 1 # 4 means probing at 25%, 50%, 75%, and 100% of the sample cap. 1 means probing just at the end.
  datasets:
    - bach
    - bracs
    - break_his
    - crc
    - esca
    - mhist
    - pcam
    - spider_breast
    - spider_colorectal
    - spider_skin
    - spider_thorax
    - wilds
  segmentation_datasets:
    - pannuke
    - segpath_epithelial
    - segpath_lymphocytes
  slide_datasets:
    - ucla_lung
  auc_datasets:
    - surgen
  survival_datasets:
    - leopard_bcr
    - cptac_pda_os
  robustness_datasets:
    - pathorob
  dataset_roots:
    bach: /data/thunder-data/bach
    bracs: /data/thunder-data/bracs
    break_his: /data/thunder-data/break_his
    crc: /data/thunder-data/crc
    esca: /data/thunder-data/esca
    mhist: /data/thunder-data/mhist
    pcam: /data/thunder-data/patch_camelyon
    spider_breast: /data/thunder-data/spider_breast
    spider_colorectal: /data/thunder-data/spider_colorectal
    spider_skin: /data/thunder-data/spider_skin
    spider_thorax: /data/thunder-data/spider_thorax
    wilds: /data/thunder-data/wilds
    pannuke: /data/thunder-data/pannuke
    segpath_epithelial: /data/thunder-data/segpath_epithelial
    segpath_lymphocytes: /data/thunder-data/segpath_lymphocytes
    cptac_pda_os: /data/CPTAC-PDA
    leopard_bcr: /data/leopard_bcr
    pathorob: /data/pathorob
    surgen: /data/surgen
    ucla_lung: /data/ucla-lung
